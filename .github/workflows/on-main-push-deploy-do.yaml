name: Deploy to DigitalOcean Droplet
'on':
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{secrets.HOST}}
          username: ${{secrets.USERNAME}}
          key: ${{secrets.KEY}}
          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            rm -rf /var/www/admin.vesselcomic.com/backend
            mkdir /var/www/admin.vesselcomic.com/
            cd /var/www/admin.vesselcomic.com/ backend
            git clone git@github.com:chesterblack/vessel
            echo 'Deployment to digitalocean finished'
